services:
  api:
    build: .
    user: root
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT}:8080"
    volumes:
      - /home/arsen/missile-prefictor:/app/data
    environment:
      - Telegram__ApiId=${TELEGRAM_API_ID}
      - Telegram__ApiHash=${TELEGRAM_API_HASH}
      - Telegram__Channel=${TELEGRAM_CHANNEL}
      - Telegram__PhoneNumber=${TELEGRAM_PHONE}
      - Google__SpreadsheetId=${GOOGLE_SPREADSHEET_ID}
      - Google__Range=${GOOGLE_RANGE}
      - Google__CredentialsFilePath=/app/data/credentials.json
      - HomeAssistant__BaseUrl=${HOMEASSISTANT_BASEURL}
      - HomeAssistant__Token=${HOMEASSISTANT_TOKEN}
      - HomeAssistant__WebhookId=${HOMEASSISTANT_WEBHOOKID}
      - HomeAssistant__AccessClientId=${HOMEASSISTANT_CF_CLIENT_ID}
      - HomeAssistant__AccessClientSecret=${HOMEASSISTANT_CF_CLIENT_SECRET}